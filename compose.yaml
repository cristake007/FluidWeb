name: fluidweb

services:
  database:
    profiles: [dev, prod]
    image: postgres:18.4-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluidweb}
      POSTGRES_USER: ${POSTGRES_USER:-fluidweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluidweb-dev-password}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-fluidweb}", "-U", "${POSTGRES_USER:-fluidweb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - database_data:/var/lib/postgresql

  frontend-dev:
    profiles: [dev]
    build:
      context: .
      target: frontend_dev
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    expose:
      - "4200"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:4200')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    init: true
    tty: true

  app-dev:
    profiles: [dev]
    build:
      context: .
      target: app_dev
    depends_on:
      database:
        condition: service_healthy
      frontend-dev:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_HOST: ${APP_HOST:-:80}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fluidweb}:${POSTGRES_PASSWORD:-fluidweb-dev-password}@database:5432/${POSTGRES_DB:-fluidweb}?serverVersion=18&charset=utf8
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-fluidweb-dev-mercure-secret}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-fluidweb-dev-mercure-secret}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_URL: http://app-dev/.well-known/mercure
      XDEBUG_MODE: ${XDEBUG_MODE:-develop}
    volumes:
      - ./backend:/app/backend
      - backend_vendor:/app/backend/vendor
      - backend_var:/app/backend/var
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  app-prod:
    profiles: [prod]
    image: ${FLUIDWEB_IMAGE:-fluidweb:local}
    build:
      context: .
      target: app_prod
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_HOST: ${APP_HOST:-:80}
      APP_SECRET: ${APP_SECRET:-change-this-production-secret}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fluidweb}:${POSTGRES_PASSWORD:-fluidweb-dev-password}@database:5432/${POSTGRES_DB:-fluidweb}?serverVersion=18&charset=utf8
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-change-this-mercure-secret}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-change-this-mercure-secret}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_URL: http://app-prod/.well-known/mercure
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
  database_data:
  caddy_data:
  caddy_config:
