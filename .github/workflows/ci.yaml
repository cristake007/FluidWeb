---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Validate Composer
        run: docker compose exec -T php composer validate --strict
      - name: Validate Symfony configuration
        run: |
          docker compose exec -T php php bin/console lint:yaml config
          docker compose exec -T php php bin/console lint:container
      - name: Run PHPStan
        run: |
          docker compose exec -T php php bin/console cache:warmup --env=dev
          docker compose exec -T php vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Check PHP code style
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Check frontend formatting
        run: docker compose exec -T frontend npm run format:check
      - name: Lint frontend
        run: docker compose exec -T frontend npm run lint
      - name: Build frontend
        run: docker compose exec -T frontend npm run build
      - name: Run frontend tests
        run: docker compose exec -T frontend npm run test:ci
      - name: Run PHPUnit
        run: docker compose exec -T php php bin/phpunit
      - name: Check API reachability
        run: curl -v --fail-with-body http://localhost/api/v1/stare
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --fail-with-body 'http://localhost/.well-known/mercure?topic=test'
