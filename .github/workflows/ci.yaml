---
name: CI

on:
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose
        run: docker compose --profile dev config --quiet

      - name: Build development images
        run: docker compose --profile dev build --pull

      - name: Start development services
        run: docker compose --profile dev up --wait -d

      - name: Validate backend
        run: |
          docker compose --profile dev exec -T app-dev composer validate --strict
          docker compose --profile dev exec -T app-dev php bin/console lint:yaml config
          docker compose --profile dev exec -T app-dev php bin/console lint:container
          docker compose --profile dev exec -T app-dev php bin/console cache:warmup --env=dev
          docker compose --profile dev exec -T app-dev vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          docker compose --profile dev exec -T app-dev vendor/bin/php-cs-fixer fix --dry-run --diff
          docker compose --profile dev exec -T app-dev php bin/phpunit

      - name: Validate frontend
        run: |
          docker compose --profile dev exec -T frontend-dev npm run format:check
          docker compose --profile dev exec -T frontend-dev npm run lint
          docker compose --profile dev exec -T frontend-dev npm run build
          docker compose --profile dev exec -T frontend-dev npm run test:ci

      - name: Check routes
        run: |
          curl --fail-with-body http://localhost/
          curl --fail-with-body http://localhost/api/v1/stare

      - name: Stop services
        if: always()
        run: docker compose --profile dev down --remove-orphans
