---
name: CI

on:
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Validate Composer
        run: docker compose exec -T php composer validate --strict
      - name: Validate Symfony configuration
        run: |
          docker compose exec -T php php bin/console lint:yaml config
          docker compose exec -T php php bin/console lint:container
      - name: Run PHPStan
        run: |
          docker compose exec -T php php bin/console cache:warmup --env=dev
          docker compose exec -T php vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Check PHP code style
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Check frontend formatting
        run: docker compose exec -T frontend npm run format:check
      - name: Lint frontend
        run: docker compose exec -T frontend npm run lint
      - name: Build frontend
        run: docker compose exec -T frontend npm run build
      - name: Run frontend tests
        run: docker compose exec -T frontend npm run test:ci
      - name: Run PHPUnit
        run: docker compose exec -T php php bin/phpunit
      - name: Check API reachability
        run: curl -v --fail-with-body http://localhost/api/v1/stare
      - name: Check Mercure reachability
        run: curl -vI --fail-with-body 'http://localhost/.well-known/mercure?topic=test'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_HTML: false
          VALIDATE_JSON: false
          VALIDATE_YAML_PRETTIER: false
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true
          FILTER_REGEX_EXCLUDE: ^backend/config/reference\.php$
