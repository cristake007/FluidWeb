---
name: CI

on:
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose
        run: docker compose --profile dev config --quiet

      - name: Build development images
        run: docker compose --profile dev build --pull

      - name: Start development services
        run: docker compose --profile dev up --wait -d database app-dev

      - name: Build frontend assets
        run: |
          docker compose --profile dev run --rm assets-dev npm ci
          docker compose --profile dev run --rm assets-dev npm run build

      - name: Validate application
        run: |
          docker compose --profile dev exec -T app-dev composer validate --strict
          docker compose --profile dev exec -T app-dev php bin/console lint:yaml config
          docker compose --profile dev exec -T app-dev php bin/console lint:twig templates
          docker compose --profile dev exec -T app-dev php bin/console lint:container
          docker compose --profile dev exec -T app-dev php bin/console cache:warmup --env=dev
          docker compose --profile dev exec -T app-dev vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          docker compose --profile dev exec -T app-dev vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Prepare test database
        run: |
          docker compose --profile dev exec -T app-dev php bin/console doctrine:database:create --env=test --if-not-exists
          docker compose --profile dev exec -T app-dev php bin/console doctrine:migrations:migrate --env=test --no-interaction --all-or-nothing

      - name: Run application tests
        run: docker compose --profile dev exec -T app-dev php bin/phpunit

      - name: Check routes
        run: |
          curl --fail-with-body http://localhost/
          curl --fail-with-body http://localhost/api/v1/stare

      - name: Build production image
        run: docker compose --profile prod build

      - name: Verify production dependencies
        run: |
          docker compose --profile prod run --rm --no-deps --entrypoint php app-prod -r '
          require "/app/vendor/autoload.php";

          $classes = [
              "PHPUnit\\Framework\\TestCase",
              "PHPStan\\Analyser\\Analyser",
              "Symfony\\Bundle\\DebugBundle\\DebugBundle",
              "Symfony\\Bundle\\MakerBundle\\MakerBundle",
              "Symfony\\Bundle\\WebProfilerBundle\\WebProfilerBundle",
          ];

          $autoloadable = array_filter($classes, static fn (string $class): bool => class_exists($class));

          if ([] !== $autoloadable) {
              fwrite(STDERR, "Development classes are autoloadable: ".implode(", ", $autoloadable).PHP_EOL);
              exit(1);
          }
          '

      - name: Verify production runtime
        run: |
          docker compose --profile prod run --rm --no-deps --entrypoint sh app-prod -c '
          test -f /app/public/build/entrypoints.json
          test -f /app/public/build/manifest.json
          test ! -d /app/node_modules
          ! command -v node
          ! command -v npm
          '

      - name: Stop services
        if: always()
        run: docker compose --profile dev down --remove-orphans
