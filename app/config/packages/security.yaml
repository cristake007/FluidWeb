security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        utilizatori:
            entity:
                class: App\Entity\Utilizator
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: utilizatori
            user_checker: App\Security\VerificatorUtilizator
            entry_point: App\Security\PunctIntrareAplicatie
            form_login:
                login_path: autentificare
                check_path: autentificare
                username_parameter: email
                password_parameter: parola
                enable_csrf: true
                csrf_token_id: autentificare
                default_target_path: pagina_principala
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                cache_pool: cache.autentificare_limiter
            logout:
                path: deconectare
                target: autentificare
                invalidate_session: true
                enable_csrf: true
                csrf_token_id: deconectare

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/v1/stare$, methods: [GET], roles: PUBLIC_ACCESS }
        # Rutele exista exclusiv in mediul test pentru infrastructura API v1.
        - { path: ^/api/v1/test/(exceptie-interna|prea-multe-cereri|resursa-negasita|log-corelare)$, roles: PUBLIC_ACCESS }
        - { route: ^autentificare$, roles: PUBLIC_ACCESS }
        - { route: ^api_v1_, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            main:
                login_throttling:
                    max_attempts: 2
                    interval: '15 minutes'
