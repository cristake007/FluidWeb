[package]
name = "fluidweb"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.8.20" }
leptos_router = { version = "=0.8.14" }
leptos_meta = { version = "=0.8.6" }
leptos_ui = "=0.3.22"
tw_merge = { version = "=0.1.21", features = ["variant"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-net = { version = "0.6", optional = true, features = ["http"] }
web-sys = { version = "0.3", optional = true, features = ["HtmlInputElement", "Location", "Window"] }

axum = { version = "=0.8.9", optional = true }
axum-extra = { version = "=0.12.6", optional = true, features = ["cookie"] }
leptos_axum = { version = "=0.8.10", optional = true }
async-graphql = { version = "=7.2.1", optional = true, features = ["chrono", "graphiql", "uuid"] }
async-graphql-axum = { version = "=7.2.1", optional = true }
sqlx = { version = "=0.9.0", optional = true, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", optional = true, features = ["compression-gzip", "trace"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "=0.6.4", optional = true, features = ["getrandom"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = []
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:gloo-net",
  "dep:web-sys",
]
ssr = [
  "dep:anyhow",
  "dep:argon2",
  "dep:async-graphql",
  "dep:async-graphql-axum",
  "dep:axum",
  "dep:axum-extra",
  "dep:hex",
  "dep:leptos_axum",
  "dep:rand_core",
  "dep:sha2",
  "dep:sqlx",
  "dep:tokio",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "fluidweb"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
